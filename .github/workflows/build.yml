name: Build Plugin

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize main-branch runs so releases publish in run order: two quick merges would
# otherwise race, and the older run finishing last would take "Latest" (#75). Queued
# main runs wait instead of being cancelled; PR runs cancel superseded pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.UniqueSingles
  PLUGIN_VERSION: 1.0.2.${{ github.run_number }}
  DOTNET_VERSION: 8.0.405

jobs:
  build:
    strategy:
      # A Windows test failure must not cancel the Linux leg that publishes releases.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install audio test decoder (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -version
          dpkg-query --show ffmpeg

      - name: Install audio test decoder (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          Get-Command ffmpeg
          ffmpeg -version

      - name: Prepare pinned Lidarr binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests -p 'test_prepare_lidarr.py'
          python3 scripts/prepare-lidarr.py

      - name: Prepare pinned Lidarr binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p 'test_prepare_lidarr.py'
          python scripts/prepare-lidarr.py

      - name: Build
        shell: bash
        run: |
          dotnet restore UniqueSingles.sln
          dotnet build UniqueSingles.sln -c Release --no-restore -p:PluginVersion=${PLUGIN_VERSION}

      - name: Test
        shell: bash
        env:
          EXPECTED_PLUGIN_VERSION: ${{ env.PLUGIN_VERSION }}
        run: |
          dotnet test tests/UniqueSingles.Test/UniqueSingles.Test.csproj -c Release --no-build --verbosity normal

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        with:
          name: plugin-package
          path: _temp/bin/Release/UniqueSingles/${{ env.PLUGIN_NAME }}.net8.0.zip
          if-no-files-found: error
          retention-days: 1

  # The only job that gets a write-capable token; PR runs never reach it. It runs on
  # main even when the Windows leg failed (!cancelled), matching the earlier behaviour
  # where only the Linux leg gated the release, and fails if Linux produced no package.
  release:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: release

      # Concurrency orders runs that start together, but a re-run of an older main run
      # still publishes after newer releases exist. Only claim "Latest" when this build
      # is at least as new as the current Latest release (#75).
      - name: Decide whether this build becomes Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No release yet, or a failed lookup, keeps the previous behaviour (claim Latest).
          if ! current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>lookup.err); then
            echo "::warning::Could not read the current Latest release ($(head -c 300 lookup.err)); marking this build Latest."
            current=""
          fi
          newest=$(printf '%s\n%s\n' "$current" "$PLUGIN_VERSION" | sed '/^$/d' | sort -V | tail -n1)
          if [ "$newest" = "$PLUGIN_VERSION" ]; then
            make_latest=true
          else
            make_latest=false
            echo "::warning::$PLUGIN_VERSION is older than the current Latest release $current; publishing without marking it Latest."
          fi
          echo "current Latest: ${current:-<none>}; this build: $PLUGIN_VERSION; make_latest=$make_latest"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset
        # Third-party action holding the write token: pinned to a commit SHA (see dependabot.yml).
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_VERSION }}
          # Publish a real release on main so Lidarr's update check can offer and
          # install it (the draft: true regression behind #25). PR builds never
          # reach this job. Latest goes only to a build at least as new as the
          # current Latest (see the step above), never to a re-run of an old one.
          draft: false
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: release/${{ env.PLUGIN_NAME }}.net8.0.zip

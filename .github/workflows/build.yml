name: Build Plugin

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_NAME: Lidarr.Plugin.UniqueSingles
  PLUGIN_VERSION: 1.0.2.${{ github.run_number }}
  DOTNET_VERSION: 8.0.405

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install audio test decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -version
          dpkg-query --show ffmpeg

      - name: Prepare pinned Lidarr binaries
        run: |
          python3 -m unittest discover -s tests -p 'test_prepare_lidarr.py'
          python3 scripts/prepare-lidarr.py

      - name: Build
        run: |
          dotnet restore UniqueSingles.sln
          dotnet build UniqueSingles.sln -c Release --no-restore /p:PluginVersion=${PLUGIN_VERSION}

      - name: Test
        env:
          EXPECTED_PLUGIN_VERSION: ${{ env.PLUGIN_VERSION }}
        run: |
          dotnet test tests/UniqueSingles.Test/UniqueSingles.Test.csproj -c Release --no-build --verbosity normal

      - name: Zip Plugin
        if: github.ref == 'refs/heads/main'
        run: |
          cp _temp/bin/Release/UniqueSingles/${{ env.PLUGIN_NAME }}.net8.0.zip /tmp/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_VERSION }}
          draft: true
          files: /tmp/${{ env.PLUGIN_NAME }}.net8.0.zip

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for eligible updates
        if: >-
          steps.metadata.outputs.package-ecosystem != 'docker' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
            (
              steps.metadata.outputs.dependency-type == 'direct:development' &&
              steps.metadata.outputs.update-type == 'version-update:semver-major'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          # Third-party actions are SHA-pinned so a human reviews each new release
          # (pinning policy in dependabot.yml): never auto-merge them. Action names
          # contain "/" (owner/repo); NuGet package IDs never do.
          IFS=',' read -ra names <<< "$DEPENDENCY_NAMES"
          for name in "${names[@]}"; do
            name="${name// /}"
            if [[ "$name" == */* && "$name" != actions/* && "$name" != github/* ]]; then
              echo "Not auto-merging: $name is a third-party action and needs review."
              exit 0
            fi
          done
          gh pr merge "$PR_URL" --auto --squash --delete-branch

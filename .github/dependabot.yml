version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-patch-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      # codeql.yml deliberately tracks the moving major tag (v4); do not propose pinned bumps (see #18).
      - dependency-name: "github/codeql-action"

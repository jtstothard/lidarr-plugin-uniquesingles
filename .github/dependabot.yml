version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-patch-minor:
        update-types:
          - patch
          - minor

  # Action pinning policy: GitHub-owned actions (actions/*, github/*) track their major
  # tag; third-party actions are pinned to a full commit SHA with a version comment,
  # which Dependabot keeps updated. Third-party code is the supply-chain risk, and in
  # this repo it runs with write tokens (release, auto-merge), so Dependabot PRs for
  # third-party actions are never auto-merged (dependabot-auto-merge.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      # codeql.yml deliberately tracks the moving major tag (v4); do not propose pinned bumps (see #18).
      - dependency-name: "github/codeql-action"
